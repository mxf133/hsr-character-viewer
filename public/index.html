  <meta name="robots" content="noindex">
  <title>星穹铁道 · 角色信息（开发中）</title>

<body>
  <!--
    这里是**唯一的**对外页面：程序开发中，界面还没定稿。

    为什么把原来的界面整个删掉（v4.6.85）：用户 2026-10 看过之后认为那一版网页界面
    写得很糟糕，而最终版本还没定；与其把一个不打算保留的界面挂出去，不如明确写
    「还在更新中」。删掉的是**界面**（index.html 的版面 + 8 个前端脚本 + 2 份样式），
    `advice.js`（算分核心）与 `format.js`（字段解析）搬到 `src/core/` 继续给服务端与
    工具使用，所以后端服务、数据管线、推荐算法都还在。

    ⚠️ 这一页**故意不带任何脚本**：没有登录、不读缓存、不发 `/api/*` 请求。
    重做界面时不要往这里加临时代码 —— 新界面应当另起一套文件（`public/scripts/**`），
    这一页留给「界面还没接上」的那段时间。
  -->
  <div class="starfield" aria-hidden="true"></div>

  <main class="notice">
    <p class="badge">🚧 开发中</p>
    <h1>程序还在更新中，敬请期待</h1>
    <p class="lead">
      网页界面正在重做。后端服务、米游社战绩读取与抽卡推荐算法都已经在仓库里，
      但界面还没定稿，所以这一版先不对外开放。
    </p>
    <p class="hint">
      想看进度或提建议：<a href="https://github.com/mxf133/hsr-character-viewer">github.com/mxf133/hsr-character-viewer</a>
    </p>
    <p class="foot">崩坏：星穹铁道 · 角色信息查询 + 抽卡推荐</p>
  </main>
